<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Pathwise</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mascot"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 17.25 L7.2 6.75 Q7.2 3.75 10.2 3.75 Q13.2 3.75 13.2 6.75 Q13.2 9.3 10.5 9.75 L7.8 10.2"/><circle cx="7.8" cy="10.2" r="1.1" fill="currentColor"/></svg></div>
      <h1 style="font-size:23px; margin-bottom:6px;">Welcome back</h1>
      <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:26px;">Pick up your streak where you left off.</p>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>

      <a href="courses.html" class="btn btn-primary btn-block" style="margin-top:6px;">Sign in</a>

      <div class="divider">OR</div>

      <button class="btn btn-ghost btn-block">Continue with Google</button>

      <p style="text-align:center; font-size:13px; color:var(--ink-soft); margin-top:22px;">
        New here? <a href="sign-up.html" style="color:var(--primary); font-weight:700;">Create an account</a>
      </p>
    </div>
  </div>
</body>
</html>
